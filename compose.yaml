# =================================================================
# 7. LOCAL AI (OLLAMA + OPEN WEBUI)
# =================================================================

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    cpu_shares: 768
    ports:
      - "11434:11434" # <--- Host Port : Container Port
    environment:
      - TZ=Asia/Bangkok
      - OLLAMA_HOST=0.0.0.0:11434
    volumes:
      - /home/op/Dockerapps_config/Configs/ollama:/root/.ollama
    networks:
      - homelab
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    cpu_shares: 512
    environment:
      - TZ=Asia/Bangkok
      - OLLAMA_BASE_URL=http://ollama:11434
      - ENABLE_OLLAMA_API=true
      - WEBUI_URL=https://ai.opaleiei.duckdns.org
    volumes:
      - /home/op/Dockerapps_config/Configs/open-webui:/app/backend/data
    depends_on:
      - ollama
    ports:
      - "3001:8080"
    networks:
      - homelab

# =================================================================
# NETWORKS DEFINITIONS
# =================================================================

networks:
  homelab:
    driver: bridge
  wg:
    driver: bridge
    enable_ipv6: true
    ipam:
      driver: default
      config:
        - subnet: 10.42.42.0/24
        - subnet: fdcc:ad94:bacf:61a3::/64
  macvlan_lan:
    driver: macvlan
    driver_opts:
      parent: enp3s0
    ipam:
      config:
        - subnet: 192.168.1.0/24
          gateway: 192.168.1.1

volumes:
  immich-model-cache:
